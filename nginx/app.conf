server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Allow reasonably large uploads (e.g. CKEditor images).
    client_max_body_size 20M;

    # Static files collected by `collectstatic` (STATIC_ROOT=/app/staticfiles).
    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 30d;
    }

    # User-uploaded media (MEDIA_ROOT=/app/media). See note in README: for
    # multi-replica k8s this must be object storage / a shared PVC to persist.
    location /media/ {
        alias /app/media/;
        access_log off;
        expires 30d;
    }

    # Everything else goes to gunicorn on the loopback interface.
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
