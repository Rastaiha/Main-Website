services:

  db:
    image: postgres:15-alpine
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # All-in-one: nginx (public :80) + gunicorn together in one image.
  # TLS is expected to be terminated upstream (k8s ingress / load balancer).
  web:
    image: ${WEB_IMAGE:-ghcr.io/rastaiha/main-website-web:main}
    # Run supervisord (nginx + gunicorn). Set explicitly so it overrides the
    # dev `runserver` command when this file is merged over docker-compose.yml.
    command: ["supervisord", "-c", "/etc/supervisord.conf"]
    ports:
      - "80:80"
    env_file:
      - .env
    depends_on:
      - db
      - redis

  worker:
    image: ${WEB_IMAGE:-ghcr.io/rastaiha/main-website-web:main}
    entrypoint: ["/app/entrypoint.worker.prod.sh"]
    command: celery -A Rasta_Web worker --loglevel=info
    env_file:
      - .env
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
