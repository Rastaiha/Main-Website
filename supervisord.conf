[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

; Django app server — bound to loopback only; nginx is the public entrypoint.
[program:gunicorn]
command=gunicorn Rasta_Web.wsgi:application --bind 127.0.0.1:8000 --workers 3 --timeout 60
directory=/app
autostart=true
autorestart=true
startsecs=3
stopsignal=TERM
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Reverse proxy — serves /static/ and /media/ directly, proxies the rest to gunicorn.
[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
startsecs=3
stopsignal=QUIT
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
